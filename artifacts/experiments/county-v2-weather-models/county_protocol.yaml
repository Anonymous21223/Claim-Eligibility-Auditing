experiment_id: county-v2-weather-models
case_name: Agricultural external-resolution check
population: WHEAT__WINTER county-year panel with >=10 train-period observations per retained county
target: County-specific linear yield residual, with the linear trend fit using only rows available at each evaluation stage.
source_scope: USDA NASS Quick Stats county annual yield responses acquired before model fitting
train_split: "year <= 2018"
validation_split: "2019 <= year <= 2021"
locked_holdout_split: "year >= 2022"
selected_on_validation: extra_trees_weather
selection_rule: Choose the lowest validation RMSE among the listed candidates. No holdout score, tail metric, subgroup, or explanation is used for selection.
feature_groups:
  metadata: ['county_fips', 'county_lat', 'county_lon']
  weather: ['t2m_mean_c', 't2m_max_c', 't2m_min_c', 'precip_total_mm']
same_task_baseline: zero residual after train/validation detrending
holdout_rows: 1024
holdout_years: [2022, 2023, 2024, 2025]
gate_a: selected model vs zero residual baseline; upper paired 95% CI must be < 0
gate_b1: full vs metadata-only; upper paired 95% CI must be < 0 for weather-specific explanations
gate_a_status: FAIL
gate_b1_status: PASS
explanation_availability: ABSTAIN
claim_boundary: county-level agricultural abstention case; no successful agricultural prediction or transfer claim
predictions: artifacts/experiments/county-v2-weather-models/county_predictions.csv
bootstrap: artifacts/experiments/county-v2-weather-models/county_bootstrap.csv
